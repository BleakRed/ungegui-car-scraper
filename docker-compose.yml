services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - db-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/cars.db
      - SCRAPE_INTERVAL_HOURS=6
      - AUTO_SCRAPE=true
      - MAX_DETAIL_PAGES=20
      - FRONTEND_URL=http://localhost:5173
      - FRIEND_FRONTEND_URL=http://localhost:5174
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
